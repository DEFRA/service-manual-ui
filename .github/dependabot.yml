version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Two pull requests a week: one for minor and patch updates, which are
    # usually safe to merge together, and one for major updates, which can
    # break things and need checking one by one
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

      major:
        patterns:
          - '*'
        update-types:
          - major

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    # Wait 7 days after a release, to match min-release-age in .npmrc
    cooldown:
      default-days: 7

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Split the same way as npm, so major updates never ride along with safe ones
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

      actions-major:
        patterns:
          - '*'
        update-types:
          - major

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    # Wait 7 days after a release, the same as npm
    cooldown:
      default-days: 7
