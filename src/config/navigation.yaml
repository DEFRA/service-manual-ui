# =============================================================================
# NAVIGATION CONFIGURATION
# =============================================================================
# Centralized navigation patterns for the Defra Service Manual
# 
# This file contains all customNav and sectionNav patterns used across markdown files.
# Reference these by key in markdown frontmatter instead of duplicating the full structure.
#
# Usage examples:
#   customNav: nav-ai-toolkit
